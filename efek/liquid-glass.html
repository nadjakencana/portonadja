<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Glass SVG Refraction Filter</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Radio+Canada+Big:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Radio Canada Big', sans-serif;
    }

    .bg-container {
      position: absolute;
      inset: -50px;
      background: url("https://images.unsplash.com/photo-1432251407527-504a6b4174a2?q=80&w=1480&auto=format&fit=crop") center center;
      background-size: cover;
      z-index: 1;
      animation: moveBackground 60s linear infinite alternate;
    }

    @keyframes moveBackground {
      0% { transform: translate(0, 0) scale(1.05); }
      100% { transform: translate(40px, 30px) scale(1.1); }
    }

    .wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px;
      background-color: rgba(0, 0, 0, 0.2);
    }

    /* ── Glass Effect Wrapper ── */
    .glass-effect {
      position: relative;
      display: flex;
      font-weight: 600;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25), 0 0 40px rgba(0, 0, 0, 0.1);
      transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 2.2);
    }

    .glass-backdrop {
      position: absolute;
      inset: 0;
      z-index: -2;
      border-radius: inherit;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      /* Apply the custom SVG liquid filter */
      filter: url(#glass-distortion);
      isolation: isolate;
    }

    .glass-tint {
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background: rgba(255, 255, 255, 0.22);
    }

    .glass-border {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: 
        inset 2px 2px 2px 0 rgba(255, 255, 255, 0.4), 
        inset -1px -1px 2px 1px rgba(255, 255, 255, 0.2),
        0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .glass-content {
      position: relative;
      z-index: 3;
    }

    /* Dock styling */
    .dock {
      border-radius: 28px;
      padding: 12px 16px;
    }

    .dock:hover {
      padding: 16px 20px;
      border-radius: 36px;
    }

    .dock-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .dock-icon {
      width: 56px;
      height: 56px;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 2.2);
      transform-origin: center bottom;
      cursor: pointer;
    }

    .dock-icon:hover {
      transform: scale(1.3) translateY(-10px);
    }

    /* Button styling */
    .btn-glass {
      border-radius: 28px;
      padding: 24px 44px;
    }

    .btn-glass:hover {
      padding: 28px 48px;
      border-radius: 36px;
    }

    .btn-glass-inner {
      font-size: 1.15rem;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 2.2);
    }

    .btn-glass:hover .btn-glass-inner {
      transform: scale(0.95);
    }

    /* Hide standard SVG in layout */
    .svg-filter-container {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Background image animation container -->
  <div class="bg-container"></div>

  <!-- SVG Refractive Displacement Glass Filter -->
  <div class="svg-filter-container">
    <svg>
      <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
        <feTurbulence type="fractalNoise" baseFrequency="0.001 0.005" numOctaves="1" seed="17" result="turbulence" />
        <feComponentTransfer in="turbulence" result="mapped">
          <feFuncR type="gamma" amplitude="1" exponent="10" offset="0.5" />
          <feFuncG type="gamma" amplitude="0" exponent="1" offset="0" />
          <feFuncB type="gamma" amplitude="0" exponent="1" offset="0.5" />
        </feComponentTransfer>
        <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap" />
        <feSpecularLighting in="softMap" surfaceScale="5" specularConstant="1" specularExponent="100" lightingColor="white" result="specLight">
          <fePointLight x="-200" y="-200" z="300" />
        </feSpecularLighting>
        <feComposite in="specLight" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litImage" />
        <feDisplacementMap in="SourceGraphic" in2="softMap" scale="200" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
  </div>

  <div class="wrapper">
    
    <!-- Dock glassmorphism card -->
    <div class="glass-effect dock">
      <div class="glass-backdrop"></div>
      <div class="glass-tint"></div>
      <div class="glass-border"></div>
      <div class="glass-content">
        <div class="dock-inner">
          <img src="https://parsefiles.back4app.com/JPaQcFfEEQ1ePBxbf6wvzkPMEqKYHhPYv8boI1Rc/a13d1acfd046f503f987c1c95af582c8_low_res_Claude.png" alt="Claude" class="dock-icon">
          <img src="https://parsefiles.back4app.com/JPaQcFfEEQ1ePBxbf6wvzkPMEqKYHhPYv8boI1Rc/9e80c50a5802d3b0a7ec66f3fe4ce348_low_res_Finder.png" alt="Finder" class="dock-icon">
          <img src="https://parsefiles.back4app.com/JPaQcFfEEQ1ePBxbf6wvzkPMEqKYHhPYv8boI1Rc/c2c4a538c2d42a8dc0927d7d6530d125_low_res_ChatGPT___Liquid_Glass__Default_.png" alt="ChatGPT" class="dock-icon">
          <img src="https://parsefiles.back4app.com/JPaQcFfEEQ1ePBxbf6wvzkPMEqKYHhPYv8boI1Rc/6d26d432bd65c522b0708185c0768ec3_low_res_Maps.png" alt="Maps" class="dock-icon">
          <img src="https://parsefiles.back4app.com/JPaQcFfEEQ1ePBxbf6wvzkPMEqKYHhPYv8boI1Rc/7c59c945731aecf4f91eb8c2c5f867ce_low_res_Safari.png" alt="Safari" class="dock-icon">
          <img src="https://parsefiles.back4app.com/JPaQcFfEEQ1ePBxbf6wvzkPMEqKYHhPYv8boI1Rc/b7f24edc7183f63dbe34c1943bef2967_low_res_Steam___Liquid_Glass__Default_.png" alt="Steam" class="dock-icon">
        </div>
      </div>
    </div>

    <!-- Button glassmorphism card -->
    <div class="glass-effect btn-glass">
      <div class="glass-backdrop"></div>
      <div class="glass-tint"></div>
      <div class="glass-border"></div>
      <div class="glass-content">
        <div class="btn-glass-inner">
          How can I help you today?
        </div>
      </div>
    </div>

  </div>

</body>
</html>
